<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Plant Slasher Ninja - NPK Mission</title>
    
    <!-- นำเข้า MediaPipe Hands และ Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        
        #webcam-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Mirror effect */
            z-index: 5;
            opacity: 0.7; /* Light opacity to see game items better */
        }
        
        /* UI Elements */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 20;
            pointer-events: none;
        }
        
        .ui-box {
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 10px;
            padding: 10px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }
        
        #stats-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .stat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        
        #nutrient-meters {
            display: flex;
            gap: 15px;
        }
        
        .meter-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40px;
        }
        
        .meter-label {
            font-weight: 800;
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .meter-bar-bg {
            width: 15px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        
        .meter-bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 0%;
            transition: height 0.3s ease-out;
        }
        
        #meter-n .meter-label { color: #4CAF50; } /* Green for Nitrogen */
        #meter-n .meter-bar-fill { background-color: #4CAF50; }
        
        #meter-p .meter-label { color: #2196F3; } /* Blue for Phosphorus */
        #meter-p .meter-bar-fill { background-color: #2196F3; }
        
        #meter-k .meter-label { color: #FF9800; } /* Orange for Potassium */
        #meter-k .meter-bar-fill { background-color: #FF9800; }
        
        /* Central UI messages */
        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 30;
            pointer-events: none;
        }
        
        #game-title {
            font-size: 64px;
            font-weight: 900;
            color: #FFEB3B;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.7);
            margin: 0 0 20px 0;
        }
        
        #game-subtitle {
            font-size: 24px;
            color: white;
            margin: 0 0 40px 0;
        }
        
        .huge-text {
            font-size: 120px;
            font-weight: 900;
            margin: 0;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .huge-text.show {
            opacity: 1;
            transform: scale(1);
        }
        
        /* Control Buttons */
        #controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
        }
        
        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            pointer-events: auto;
        }
        
        button:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: white;
            transform: translateY(-2px);
        }
        
        #start-btn {
            background-color: #4CAF50;
            border-color: #4CAF50;
        }
        
        #start-btn:hover {
            background-color: #66BB6A;
        }
        
        /* Game Over / Win Screens */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        
        .screen-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        #loading-screen {
            background-color: #0a1122;
        }
        
        .loader {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #FFEB3B;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Webcam Feed -->
    <video id="webcam-video" autoplay playsinline></video>
    
    <!-- Game Drawing Canvas -->
    <canvas id="game-canvas"></canvas>
    
    <!-- Game UI -->
    <div id="ui-panel">
        <div id="stats-panel" class="ui-box">
            <div class="stat-row">
                <span>🏆 Score: <span id="score-val">0</span></span>
            </div>
            <div class="stat-row">
                <span>❤️ Lives: <span id="lives-val">3</span></span>
            </div>
            <div class="stat-row">
                <span>📊 Level: <span id="level-val">1</span></span>
            </div>
        </div>
        
        <div id="nutrient-meters" class="ui-box">
            <div id="meter-n" class="meter-container">
                <div class="meter-label">N</div>
                <div class="meter-bar-bg">
                    <div class="meter-bar-fill" id="fill-n"></div>
                </div>
            </div>
            <div id="meter-p" class="meter-container">
                <div class="meter-label">P</div>
                <div class="meter-bar-bg">
                    <div class="meter-bar-fill" id="fill-p"></div>
                </div>
            </div>
            <div id="meter-k" class="meter-container">
                <div class="meter-label">K</div>
                <div class="meter-bar-bg">
                    <div class="meter-bar-fill" id="fill-k"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Messages and Main Menu -->
    <div id="message-overlay">
        <div id="main-menu">
            <h1 id="game-title">PLANT SLASHER</h1>
            <h2 id="game-subtitle">Mission: NPK Balance</h2>
            <button id="start-btn">เริ่มต้นเกม (Start)</button>
        </div>
        
        <h1 id="big-messenger" class="huge-text">3</h1>
    </div>
    
    <!-- Control Buttons -->
    <div id="controls">
        <button id="toggle-cam-btn">ปิดกล้อง (Camera Off)</button>
    </div>
    
    <!-- Screen Overlays -->
    <div id="loading-screen" class="screen-overlay active">
        <div class="loader"></div>
        <h2>กำลังโหลดระบบ AI ตรวจจับมือ...</h2>
        <p>โปรดรอสักครู่</p>
    </div>
    
    <div id="gameover-screen" class="screen-overlay">
        <h1 style="font-size: 72px; color: #f44336;">GAME OVER</h1>
        <h2>คะแนนรวมของคุณ: <span id="final-score">0</span></h2>
        <p>พืชขาดธาตุอาหารรุนแรง การปลูกล้มเหลว</p>
        <button onclick="location.reload()" style="margin-top: 20px;">เล่นใหม่อีกครั้ง</button>
    </div>
    
    <div id="levelwin-screen" class="screen-overlay">
        <h1 style="font-size: 72px; color: #4CAF50;">LEVEL COMPLETE!</h1>
        <h2 id="level-msg">สำเร็จ! พืชได้รับธาตุอาหารครบถ้วน</h2>
        <p>เตรียมตัวสำหรับภารกิจถัดไป</p>
        <button id="next-level-btn" style="margin-top: 20px;">เริ่มเลเวลถัดไป</button>
    </div>
</div>

<script>
/**
 * AR Plant Slasher Ninja - NPK Mission
 * Game configurations and constants
 */
const CONFIG = {
    lives: 3,
    startLevel: 1,
    nutrientGoals: {
        1: { N: 5, P: 3, K: 3 },
        2: { N: 10, P: 5, K: 5 },
        3: { N: 15, P: 8, K: 8 },
        4: { N: 20, P: 10, K: 10 },
        5: { N: 25, P: 15, K: 15 }
    },
    items: {
        'N': { color: '#4CAF50', symbol: 'N', points: 10 }, // Green
        'P': { color: '#2196F3', symbol: 'P', points: 15 }, // Blue
        'K': { color: '#FF9800', symbol: 'K', points: 15 }, // Orange
        'BOMB': { color: '#f44336', symbol: '💣', points: -50, lives: -1 } // Red bomb
    },
    canvasWidth: 0,
    canvasHeight: 0
};

// Global state variables
let gameState = {
    isRunning: false,
    score: 0,
    lives: CONFIG.lives,
    level: CONFIG.startLevel,
    currentNutrients: { N: 0, P: 0, K: 0 },
    cameraActive: true,
    trackingActive: false,
    items: [],
    ninjaTrail: [],
    lastNinjaPoint: null,
    levelNutrientGoal: {},
    bombSpawnChance: 0.15, // 15% chance to spawn a bomb
    gameSpeed: 1,
    lastSpawnTime: 0,
    spawnInterval: 1200 // 1.2 seconds between item spawns
};

// Elements
const videoElement = document.getElementById('webcam-video');
const canvasElement = document.getElementById('game-canvas');
const ctx = canvasElement.getContext('2d');
const startBtn = document.getElementById('start-btn');
const toggleCamBtn = document.getElementById('toggle-cam-btn');
const bigMessenger = document.getElementById('big-messenger');
const finalScoreSpan = document.getElementById('final-score');
const levelwinMsg = document.getElementById('level-msg');

// Set canvas dimensions
function setCanvasSize() {
    canvasElement.width = window.innerWidth;
    canvasElement.height = window.innerHeight;
    CONFIG.canvasWidth = canvasElement.width;
    CONFIG.canvasHeight = canvasElement.height;
}
window.addEventListener('resize', setCanvasSize);
setCanvasSize();

// Setup nutrient goal for the level
function setupLevelGoals() {
    const goal = CONFIG.nutrientGoals[gameState.level] || CONFIG.nutrientGoals[Object.keys(CONFIG.nutrientGoals).length];
    gameState.levelNutrientGoal = goal;
    gameState.currentNutrients = { N: 0, P: 0, K: 0 };
    updateNutrientMeters();
    
    // Increase bomb chance slightly with levels
    gameState.bombSpawnChance = Math.min(0.4, 0.15 + (gameState.level - 1) * 0.05);
    // Increase game speed with levels
    gameState.gameSpeed = 1 + (gameState.level - 1) * 0.1;
    gameState.spawnInterval = Math.max(700, 1200 - (gameState.level - 1) * 100);
}

// MediaPipe Hands Initialization
let hands = null;
let camera = null;

function onHandResults(results) {
    // Hidden standard results drawing, as we do custom AR
    gameState.trackingActive = true;
    
    // Process fingertips for ninja trail
    let indexFingerTip = null;
    
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        // Find the index finger tip landmark (index 8)
        // Only use the first hand found
        indexFingerTip = results.multiHandLandmarks[0][8];
    }
    
    if (indexFingerTip) {
        // Convert landmark coordinates (0-1) to canvas coordinates
        // X is inverted because the video is mirrored
        const x = (1 - indexFingerTip.x) * CONFIG.canvasWidth;
        const y = indexFingerTip.y * CONFIG.canvasHeight;
        
        gameState.ninjaTrail.push({ x, y, timestamp: Date.now() });
        gameState.lastNinjaPoint = { x, y };
    } else {
        gameState.lastNinjaPoint = null;
    }
}

function initMediaPipe() {
    hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    
    hands.setOptions({
        maxNumHands: 1, // Focus on single hand interaction for slasher
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
    });
    
    hands.onResults(onHandResults);
    
    camera = new Camera(videoElement, {
        onFrame: async () => {
            if (gameState.cameraActive) {
                await hands.send({image: videoElement});
            }
        },
        width: 1280,
        height: 720
    });
    camera.start().then(() => {
        document.getElementById('loading-screen').classList.remove('active');
        camera.video.parentElement.style.opacity = '1';
    });
}

// UI Update Functions
function updateNutrientMeters() {
    // Calculate percentage fill for each nutrient
    const fillN = Math.min(100, (gameState.currentNutrients.N / gameState.levelNutrientGoal.N) * 100);
    const fillP = Math.min(100, (gameState.currentNutrients.P / gameState.levelNutrientGoal.P) * 100);
    const fillK = Math.min(100, (gameState.currentNutrients.K / gameState.levelNutrientGoal.K) * 100);
    
    // Update DOM fill elements
    document.getElementById('fill-n').style.height = `${fillN}%`;
    document.getElementById('fill-p').style.height = `${fillP}%`;
    document.getElementById('fill-k').style.height = `${fillK}%`;
}

function updateStatDisplay() {
    document.getElementById('score-val').innerText = gameState.score;
    document.getElementById('lives-val').innerText = gameState.lives;
    document.getElementById('level-val').innerText = gameState.level;
}

// Core Game Item Class
class GameItem {
    constructor() {
        // Determine type based on bomb spawn chance
        const rand = Math.random();
        if (rand < gameState.bombSpawnChance) {
            this.type = 'BOMB';
        } else {
            // Equal chance for N, P, or K
            const types = ['N', 'P', 'K'];
            this.type = types[Math.floor(Math.random() * types.length)];
        }
        
        this.config = CONFIG.items[this.type];
        
        // Slasher logic requires large object sizes for good UX
        this.radius = Math.random() * 20 + 50; 
        
        // Items start from bottom of screen with upward and slight sideways velocity
        this.x = Math.random() * (CONFIG.canvasWidth * 0.8) + (CONFIG.canvasWidth * 0.1);
        this.y = CONFIG.canvasHeight + this.radius * 2;
        
        this.vx = (Math.random() - 0.5) * 5; // Slight left/right
        this.vy = -(Math.random() * 5 + 15) * gameState.gameSpeed; // Strong upward, boosted by speed
        this.gravity = 0.22 * gameState.gameSpeed; // Increased gravity for faster fall
        
        this.sliced = false;
        this.lifeTime = 0;
        
        // Animation variables
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.1;
        this.fadeOpacity = 1;
    }
    
    update() {
        this.lifeTime++;
        
        if (!this.sliced) {
            // Basic physics movement for non-sliced items
            this.x += this.vx;
            this.vy += this.gravity;
            this.y += this.vy;
            
            // Boundary bouncing
            if (this.x - this.radius < 0 || this.x + this.radius > CONFIG.canvasWidth) {
                this.vx *= -1;
            }
        } else {
            // After sliced, simple movement to make pieces fly apart 
            // In full implementation, item split logic would be here
            this.fadeOpacity -= 0.05;
        }
        
        this.rotation += this.rotSpeed;
    }
    
    draw(context) {
        if (this.fadeOpacity <= 0) return;
        
        context.save();
        context.globalAlpha = this.fadeOpacity;
        context.translate(this.x, this.y);
        context.rotate(this.rotation);
        
        // Draw the main circle for the item
        context.beginPath();
        context.arc(0, 0, this.radius, 0, Math.PI * 2);
        context.closePath();
        
        // Determine coloring and glowing effects
        const gradient = context.createRadialGradient(0, 0, this.radius * 0.1, 0, 0, this.radius);
        gradient.addColorStop(0, '#FFFFFF'); // White hot core
        gradient.addColorStop(0.3, this.config.color);
        gradient.addColorStop(1, adjustColorBrightness(this.config.color, -50));
        
        context.fillStyle = gradient;
        context.fill();
        
        // Outer glow
        context.shadowColor = this.config.color;
        context.shadowBlur = 15;
        context.lineWidth = 4;
        context.strokeStyle = adjustColorBrightness(this.config.color, 50);
        context.stroke();
        
        context.shadowBlur = 0; // Reset blur for text
        
        // Drawing logic when sliced (split and fades)
        if (this.sliced) {
            // Draw a basic slash cut visual
            context.save();
            context.rotate(-this.sliceAngle);
            context.beginPath();
            context.moveTo(-this.radius * 1.5, 0);
            context.lineTo(this.radius * 1.5, 0);
            context.lineWidth = 10;
            context.strokeStyle = '#FFFFFF';
            context.stroke();
            context.restore();
        }
        
        // Draw center letter/icon
        context.fillStyle = '#FFFFFF';
        context.font = `bold ${this.radius * 1}px 'Segoe UI'`;
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.fillText(this.sliced ? "✓" : this.config.symbol, 0, 0);
        
        context.restore();
    }
}

// Item spawn logic
function spawnItems() {
    const now = Date.now();
    if (now - gameState.lastSpawnTime > gameState.spawnInterval) {
        gameState.lastSpawnTime = now;
        
        // Spawn 1 to 3 items per interval based on level speed
        const count = Math.min(3, 1 + Math.floor(Math.random() * gameState.gameSpeed));
        for (let i = 0; i < count; i++) {
            gameState.items.push(new GameItem());
        }
    }
}

// Slice collision detection
function detectSlices() {
    if (!gameState.lastNinjaPoint || gameState.ninjaTrail.length < 2) return;
    
    // Check trail segments for collisions against game items
    for (let i = Math.max(0, gameState.ninjaTrail.length - 3); i < gameState.ninjaTrail.length - 1; i++) {
        const p1 = gameState.ninjaTrail[i];
        const p2 = gameState.ninjaTrail[i+1];
        
        // Don't check old points
        if (Date.now() - p2.timestamp > 100) continue;
        
        for (let j = 0; j < gameState.items.length; j++) {
            const item = gameState.items[j];
            
            // Ignore items already sliced or off screen
            if (item.sliced || item.fadeOpacity < 1 || item.y > CONFIG.canvasHeight + item.radius) continue;
            
            // Line-circle intersection check (simplified to point-circle for UX of slasher)
            const distance = Math.hypot(item.x - p2.x, item.y - p2.y);
            
            if (distance < item.radius + 10) { // +10 for generous hitbox
                // Collision!
                item.sliced = true;
                item.sliceAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                gameState.score += item.config.points;
                
                if (item.type === 'BOMB') {
                    // Exploded bomb logic
                    gameState.lives += item.config.lives;
                    checkGameOver();
                    // Exploded visual effect in complete game
                } else {
                    // Collected nutrient logic
                    gameState.currentNutrients[item.type]++;
                    updateNutrientMeters();
                    checkLevelComplete();
                    // Slit visual effect in complete game
                }
                updateStatDisplay();
            }
        }
    }
}

// Trail cleaner (removes old trail points)
function cleanNinjaTrail() {
    const now = Date.now();
    gameState.ninjaTrail = gameState.ninjaTrail.filter(point => now - point.timestamp < 300);
}

// Level conditions checks
function checkLevelComplete() {
    // Basic goal-check logic based on level goals
    const isComplete = (
        gameState.currentNutrients.N >= gameState.levelNutrientGoal.N &&
        gameState.currentNutrients.P >= gameState.levelNutrientGoal.P &&
        gameState.currentNutrients.K >= gameState.levelNutrientGoal.K
    );
    
    if (isComplete) {
        gameState.isRunning = false;
        
        // Show Level Win Screen
        const totalItemsSliced = gameState.items.filter(item => item.sliced).length;
        levelwinMsg.innerText = `เลเวล ${gameState.level} สำเร็จ! คุณฟันพืชได้ ${totalItemsSliced} ครั้งในด่านนี้`;
        document.getElementById('levelwin-screen').classList.add('active');
        
        // Advance level for next time
        gameState.level++;
    }
}

function checkGameOver() {
    if (gameState.lives <= 0) {
        gameState.isRunning = false;
        finalScoreSpan.innerText = gameState.score;
        document.getElementById('gameover-screen').classList.add('active');
    }
}

// Game Visual Drawing Functions
function drawItems() {
    cleanNinjaTrail();
    
    // Standard slasher logic (update then draw, remove old)
    for (let i = gameState.items.length - 1; i >= 0; i--) {
        const item = gameState.items[i];
        item.update();
        item.draw(ctx);
        
        // Check if item should be removed
        if (item.sliced && item.fadeOpacity <= 0) {
            gameState.items.splice(i, 1);
        } else if (item.y > CONFIG.canvasHeight + item.radius * 3) {
            // Item fell off screen
            gameState.items.splice(i, 1);
            
            // Optional: Punish fell nutrientes based on complete slasher rules
            // Not needed for simple NPK science lesson game UX
        }
    }
}

function drawNinjaTrail() {
    if (gameState.ninjaTrail.length < 2) return;
    
    ctx.save();
    
    // Draw trail
    ctx.beginPath();
    ctx.moveTo(gameState.ninjaTrail[0].x, gameState.ninjaTrail[0].y);
    
    for (let i = 1; i < gameState.ninjaTrail.length; i++) {
        ctx.lineTo(gameState.ninjaTrail[i].x, gameState.ninjaTrail[i].y);
    }
    
    // Basic trail visual styling
    const now = Date.now();
    // Simplified gradient logic for the trail based on age
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowColor = '#00F7FF'; // Neon blue glow for P1 knife trail
    ctx.shadowBlur = 15;
    ctx.stroke();
    
    ctx.restore();
}

// Core Game Loop function
function gameLoop() {
    if (!gameState.isRunning) return;
    
    // Core drawing pipeline for the slasher AR game
    ctx.clearRect(0, 0, CONFIG.canvasWidth, CONFIG.canvasHeight); // Clear logic

    // Items and interactions
    spawnItems();
    detectSlices();
    drawItems();
    
    // Player ninja slasher visual effect
    drawNinjaTrail();
    
    // Simple drawing effect when tracking is active in slasher UX
    if (!gameState.trackingActive && gameState.lifeTime % 60 < 30) {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
        ctx.font = 'bold 30px Segoe UI';
        ctx.textAlign = 'center';
        ctx.fillText('❌ ไม่พบมือ - โปรดกางมือหน้ากล้อง ❌', CONFIG.canvasWidth / 2, CONFIG.canvasHeight / 2);
        ctx.restore();
    }
    
    gameState.lifeTime++;
    
    // Repeat Core drawing pipeline logic on next browser frame
    requestAnimationFrame(gameLoop);
}

// Core countdown logic
function startCountdown(seconds, callback) {
    let current = seconds;
    bigMessenger.innerText = current;
    bigMessenger.classList.add('show');
    
    const interval = setInterval(() => {
        current--;
        if (current > 0) {
            bigMessenger.innerText = current;
        } else if (current === 0) {
            bigMessenger.innerText = "START MISSION";
        } else {
            // End logic, kickoff game
            clearInterval(interval);
            bigMessenger.classList.remove('show');
            callback();
        }
    }, 1000);
}

// Level advance logic
function startNextLevel() {
    document.getElementById('levelwin-screen').classList.remove('active');
    
    updateStatDisplay();
    setupLevelGoals();
    gameState.items = []; // Clear old items

    // Simple countdown logic before start game, based on complete slasher UX
    startCountdown(3, () => {
        gameState.isRunning = true;
        gameLoop();
    });
}

// Game Core Controls
startBtn.addEventListener('click', () => {
    // Slasher UX standard transitions between menus and levels
    document.getElementById('main-menu').style.display = 'none';
    startNextLevel(); // Effectively starts level 1
});

toggleCamBtn.addEventListener('click', () => {
    gameState.cameraActive = !gameState.cameraActive;
    toggleCamBtn.innerText = gameState.cameraActive ? "ปิดกล้อง (Camera Off)" : "เปิดกล้อง (Camera On)";
    videoElement.style.display = gameState.cameraActive ? 'block' : 'none';
});

document.getElementById('next-level-btn').addEventListener('click', () => {
    startNextLevel(); // Effectiveness starts level++
});

// Canvas-based click-fallback collisions as per AR game rules
canvasElement.addEventListener('click', (e) => {
    // Hidden click-fallback for troubleshooting, non-standard gameplay visual
    if (!gameState.isRunning) return;
    const x = e.clientX;
    const y = e.clientY;
    
    // Very simplified point collision on click in slasher game logic
    for (let j = 0; j < gameState.items.length; j++) {
        const item = gameState.items[j];
        if (item.sliced) continue;
        const distance = Math.hypot(item.x - x, item.y - y);
        if (distance < item.radius + 15) {
            // Collision on fallback click UX rules standard for complete AR titles
            item.sliced = true;
            item.sliceAngle = Math.random() * Math.PI; // Arbitrary slice, as per slasher standard rules
            gameState.score += item.config.points;
            if (item.type === 'BOMB') {
                gameState.lives += item.config.lives; checkGameOver();
            } else {
                gameState.currentNutrients[item.type]++; updateNutrientMeters(); checkLevelComplete();
            }
            updateStatDisplay();
        }
    }
});

/**
 * Utility: Adjust brightness of a hex color
 */
function adjustColorBrightness(col, amt) {
    let usePound = false;
    if (col[0] === "#") {
        col = col.slice(1);
        usePound = true;
    }
    const num = parseInt(col, 16);
    let r = (num >> 16) + amt;
    if (r > 255) r = 255; else if (r < 0) r = 0;
    let b = ((num >> 8) & 0x00FF) + amt;
    if (b > 255) b = 255; else if (b < 0) b = 0;
    let g = (num & 0x0000FF) + amt;
    if (g > 255) g = 255; else if (g < 0) g = 0;
    return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16).padStart(6, '0');
}

// Core Game Initialization kickoff
initMediaPipe();
